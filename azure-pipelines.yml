# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: 'Checkout E-Commerce GitHub repository'

- powershell: |
    Write-Host "GitHub repository checkout successful!"
    Write-Host "Repository contents:"
    Get-ChildItem
  displayName: 'Verify repository contents'
