# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: 'Checkout E-Commerce GitHub repository'

- powershell: |
    Write-Host "Installing/updating Bicep for the agent..."
    az bicep install

    if ($LASTEXITCODE -ne 0) {
      throw "Bicep installation failed."
    }

    Write-Host "Checking Bicep version..."
    az bicep version

    if ($LASTEXITCODE -ne 0) {
      throw "Bicep version check failed."
    }

    Write-Host "Compiling Bicep template..."
    az bicep build --file infra/main.bicep --stdout

    if ($LASTEXITCODE -ne 0) {
      throw "Bicep compilation failed."
    }

    Write-Host "Bicep validation successful!"
  displayName: 'Install and validate Bicep'
