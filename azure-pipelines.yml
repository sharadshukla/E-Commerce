# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: 'Checkout E-Commerce GitHub repository'

- powershell: |
    Write-Host "Checking Bicep installation..."

    az bicep version 2>$null

    if ($LASTEXITCODE -ne 0) {
        Write-Host "Bicep is not installed. Installing now..."

        az bicep install

        if ($LASTEXITCODE -ne 0) {
            throw "Bicep installation failed."
        }
    }
    else {
        Write-Host "Bicep is already installed. Skipping installation."
    }

    Write-Host "Bicep version:"
    az bicep version

    if ($LASTEXITCODE -ne 0) {
        throw "Bicep is still unavailable."
    }

    Write-Host "Validating Bicep template..."
    az bicep build --file infra/main.bicep --stdout | Out-Null
    $buildExitCode = $LASTEXITCODE

    if ($buildExitCode -ne 0) {
        throw "Bicep validation failed."
    }

    Write-Host "Bicep validation successful!"

  displayName: 'Check Bicep installation and validate'
