# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: 'Checkout E-Commerce GitHub repository'

- powershell: |
    Write-Host "Checking Azure CLI..."
    az version

    Write-Host "Checking Bicep version..."
    az bicep version

    Write-Host "Validating Bicep infrastructure template..."
    az bicep build --file infra/main.bicep --stdout | Out-Null

    if ($LASTEXITCODE -ne 0) {
      throw "Bicep validation failed."
    }

    Write-Host "Bicep validation successful!"
  displayName: 'Validate Bicep infrastructure'
