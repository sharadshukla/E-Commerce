
parameters:
  - name: imageTag
    type: string

jobs:
  - job: ValidateAKSAccess
    displayName: 'Validate AKS Access'
    steps:
    - pwsh: |
        if ([string]::IsNullOrWhiteSpace($env:IMAGE_TAG)) {
          throw "The imageTag parameter is required. Enter the Build.BuildId tag already published to ACR (v1.2.0 used 77)."
        }
      displayName: 'Validate required image tag'
      env:
        IMAGE_TAG: ${{ parameters.imageTag }}
    - task: AzureCLI@2
      displayName: 'Validate WIF, AKS and Kubernetes RBAC'
      inputs:
        azureSubscription: 'sc-az-ecommerce-wif'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Azure DevOps authenticated identity:"
          az account show --query "{IdentityType:user.type,IdentityName:user.name}" -o json

          # Verify required tools
          foreach ($tool in @("kubectl", "kubelogin", "helm")) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $command) {
              throw "$tool is not available in the agent PATH."
            }
            Write-Host "$tool found at: $($command.Source)"
          }

          kubelogin --version
          if ($LASTEXITCODE -ne 0) { throw "kubelogin check failed." }

          helm version --short
          if ($LASTEXITCODE -ne 0) { throw "Helm check failed." }

          # Authenticate to AKS
          az aks get-credentials `
            --resource-group "$(resourceGroup)" `
            --name "$(aksCluster)" `
            --overwrite-existing

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to obtain AKS credentials."
          }

          kubelogin convert-kubeconfig -l azurecli
          if ($LASTEXITCODE -ne 0) {
            throw "kubelogin conversion failed."
          }

          kubectl auth whoami
          if ($LASTEXITCODE -ne 0) {
            throw "AKS authentication failed."
          }

          # Validate Helm deployment permissions
          $deploymentPermission = kubectl auth can-i create deployments `
            --namespace "$(namespace)"

          if ($LASTEXITCODE -ne 0 -or $deploymentPermission.Trim() -ne 'yes') {
            throw "Cannot create Deployments in target namespace."
          }

          $replicaSetPermission = kubectl auth can-i list replicasets `
            --namespace "$(namespace)"

          if ($LASTEXITCODE -ne 0 -or $replicaSetPermission.Trim() -ne 'yes') {
            throw "Cannot list ReplicaSets in target namespace."
          }

          Write-Host "AKS authentication and RBAC verified."

  - job: DeployRobotShop
    displayName: 'Deploy Robot Shop using Helm'
    dependsOn: ValidateAKSAccess
    condition: succeeded()
    steps:
    - task: AzureCLI@2
      displayName: 'Deploy Helm release to AKS'
      env:
        IMAGE_TAG: ${{ parameters.imageTag }}
      inputs:
        azureSubscription: 'sc-az-ecommerce-wif'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          # Authenticate independently for this job
          az aks get-credentials `
            --resource-group "$(resourceGroup)" `
            --name "$(aksCluster)" `
            --overwrite-existing

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to obtain AKS credentials."
          }

          kubelogin convert-kubeconfig -l azurecli
          if ($LASTEXITCODE -ne 0) {
            throw "kubelogin conversion failed."
          }

          # Deploy selected image tag
          helm upgrade --install robot-shop "$(Build.SourcesDirectory)/AKS/helm" `
            --namespace "$(namespace)" `
            --set-string "image.version=$env:IMAGE_TAG" `
            --wait `
            --timeout 15m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

          # Verify Helm release
          helm status robot-shop --namespace "$(namespace)"
          if ($LASTEXITCODE -ne 0) {
            throw "Helm release status check failed."
          }

          # ------------------------------------------------------------
          # Verify Robot Shop Kubernetes workload readiness
          # ------------------------------------------------------------
          # Confirm that all Deployments and StatefulSets belonging
          # to the Robot Shop Helm release have successfully rolled out.
          # A failed rollout causes the master pipeline to fail.
          # ------------------------------------------------------------

          $namespace = "$(namespace)"

          Write-Host "Verifying Robot Shop workload readiness..."

          $workloads = @(
              kubectl get deployments,statefulsets `
                  --namespace $namespace `
                  -o name
          )

          if ($LASTEXITCODE -ne 0 -or $workloads.Count -eq 0) {
              throw "No Kubernetes workloads found or workload query failed."
          }

          foreach ($workload in $workloads) {
              Write-Host "Checking rollout: $workload"

              kubectl rollout status $workload `
                  --namespace $namespace `
                  --timeout=180s

              if ($LASTEXITCODE -ne 0) {
                  throw "Workload rollout verification failed: $workload"
              }
          }

          Write-Host "Robot Shop workload readiness verified."

          kubectl get pods --namespace $namespace
          kubectl get services --namespace $namespace

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to retrieve Robot Shop service information."
          }


          Write-Host "Robot Shop Helm deployment completed successfully."
