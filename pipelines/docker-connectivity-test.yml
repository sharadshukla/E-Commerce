trigger: none
pr: none

pool:
  name: Default

steps:
  - powershell: |
      Write-Host "Checking Docker CLI..."
      docker --version

      Write-Host "Checking Docker Engine connectivity..."
      docker version

      Write-Host "Checking container operating system..."
      docker info --format '{{.OSType}}'
    displayName: 'Verify Docker connectivity'

  - powershell: |
      docker build -t rs-web:ci-test ./web
    displayName: 'Build Robot Shop web image'

  - task: AzureCLI@2
    displayName: 'Authenticate Docker to ACR'
    inputs:
      azureSubscription: 'sc-az-ecommerce-wif'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az acr login --name ecommerceregistrynew