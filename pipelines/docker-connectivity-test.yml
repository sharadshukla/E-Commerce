trigger: none
pr: none

pool:
  name: Default

variables:
  acrName: 'ecommerceregistrynew'
  acrLoginServer: 'ecommerceregistrynew.azurecr.io'
  imageTag: '$(Build.BuildId)'

steps:
  - powershell: |
      docker version
      docker info --format '{{.OSType}}'
    displayName: 'Verify Docker connectivity'

  - task: AzureCLI@2
    displayName: 'Build and push Robot Shop images to ACR'
    inputs:
      azureSubscription: 'sc-az-ecommerce-wif'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        az acr login --name "$(acrName)"
        if ($LASTEXITCODE -ne 0) {
          throw "ACR login failed"
        }

        $acrLoginServer = "$(acrLoginServer)"
        $imageTag = "$(imageTag)"

        $services = @(
          'cart',
          'catalogue',
          'dispatch',
          'mongodb',
          'mysql',
          'payment',
          'ratings',
          'shipping',
          'user',
          'web'
        )

        foreach ($service in $services) {
          $imageName = "rs-$service"
          $image = "${acrLoginServer}/${imageName}:${imageTag}"

          Write-Host "Building $image"

          docker build -t $image "./$service"
          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed for $service"
          }

          Write-Host "Pushing $image"

          docker push $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker push failed for $service"
          }
        }

        Write-Host "All Robot Shop images built and pushed successfully."