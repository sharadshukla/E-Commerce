
parameters:
  - name: imageTag
    displayName: 'ACR image tag to deploy'
    type: string
    default: ''

trigger: none
pr: none

pool:
  name: ecommerce-linux-pool

variables:
  resourceGroup: 'e-commerce-app'
  aksCluster: 'ecommerce-aks'
  namespace: 'robot-shop'

jobs:
  - template: templates/helm-aks-jobs.yml
    parameters:
      imageTag: ${{ parameters.imageTag }}
