
trigger: none
pr: none

pool:
  name: Default

variables:
  resourceGroup: 'e-commerce-app'
  aksCluster: 'ecommerce-aks'
  namespace: 'robot-shop'

steps:
- task: AzureCLI@2
  displayName: 'Authenticate to AKS using WIF'
  inputs:
    azureSubscription: 'sc-az-ecommerce-wif'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      $ErrorActionPreference = 'Stop'

      # Install kubectl and kubelogin
      $toolDir = "$env:AGENT_TEMPDIRECTORY\aks-tools"
      New-Item -ItemType Directory -Force -Path $toolDir | Out-Null

      $kubectl = Get-Command kubectl -ErrorAction SilentlyContinue
      $kubelogin = Get-Command kubelogin -ErrorAction SilentlyContinue

      if ($kubectl -and $kubelogin) {
          Write-Host "kubectl and kubelogin are already installed."
      } else {
          Write-Host "Installing missing AKS CLI tools..."

          $toolDir = "$env:AGENT_TEMPDIRECTORY\aks-tools"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null

          az aks install-cli `
            --install-location "$toolDir\kubectl.exe" `
            --kubelogin-install-location "$toolDir\kubelogin.exe"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to install AKS CLI tools"
          }

          $env:PATH = "$toolDir;$env:PATH"
      }

      # Obtain Entra-authenticated AKS credentials
      az aks get-credentials `
        --resource-group "$(resourceGroup)" `
        --name "$(aksCluster)" `
        --overwrite-existing

      if ($LASTEXITCODE -ne 0) {
        throw "Failed to obtain AKS credentials"
      }

      kubelogin convert-kubeconfig -l azurecli

      if ($LASTEXITCODE -ne 0) {
        throw "kubelogin conversion failed"
      }

      # Verify authenticated identity
      kubectl auth whoami

      if ($LASTEXITCODE -ne 0) {
        throw "AKS authentication failed"
      }

      # Verify deployment permission
      $permission = kubectl auth can-i create deployments `
        --namespace "$(namespace)"

      if ($LASTEXITCODE -ne 0 -or $permission.Trim() -ne 'yes') {
        throw "Kubernetes RBAC authorization failed"
      }

      Write-Host "AKS authentication and RBAC verified."


      # Verify Helm availability
      $helm = Get-Command helm -ErrorAction SilentlyContinue

      if (-not $helm) {
          throw "Helm is not installed or is not available in the agent PATH."
      }

      helm version --short

      if ($LASTEXITCODE -ne 0) {
          throw "Helm version check failed."
      }

      Write-Host "Helm is available. CD prerequisites verified."
