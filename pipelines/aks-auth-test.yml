trigger: none
pr: none

pool:
  name: Default

steps:
- task: AzureCLI@2
  displayName: 'Verify AKS authentication and RBAC'
  inputs:
    azureSubscription: 'sc-az-ecommerce-wif'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      $ErrorActionPreference = 'Stop'

      az aks get-credentials `
        --resource-group e-commerce-app `
        --name ecommerce-aks `
        --overwrite-existing

      if ($LASTEXITCODE -ne 0) {
        throw "Failed to retrieve AKS credentials"
      }

      kubelogin convert-kubeconfig -l azurecli

      if ($LASTEXITCODE -ne 0) {
        throw "Failed to configure kubelogin"
      }

      $permission = kubectl auth can-i create deployments -n robot-shop

      if ($LASTEXITCODE -ne 0 -or $permission.Trim() -ne 'yes') {
        throw "Deployment permission not granted. Result: $permission"
      }

      Write-Host "AKS authentication and deployment authorization verified."