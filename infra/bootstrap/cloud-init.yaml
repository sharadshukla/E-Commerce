
#cloud-config

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-apt
  - git
  - ansible
  - curl
  - ca-certificates
  - gnupg
  - unzip

write_files:
  - path: /etc/ecommerce-agent-bootstrap/config.json
    owner: root:root
    permissions: '0600'
    encoding: b64
    content: __BOOTSTRAP_CONFIG_BASE64__

runcmd:
  - [mkdir, -p, /opt/ecommerce-agent]
  - [python3, -c, "import json, subprocess; c=json.load(open('/etc/ecommerce-agent-bootstrap/config.json')); subprocess.run(['git', 'clone', '--', c['bootstrap_repo_url'], '/opt/ecommerce-source'], check=True); subprocess.run(['git', '-C', '/opt/ecommerce-source', 'checkout', '--detach', c['bootstrap_commit_sha']], check=True)"]
  - [ansible-playbook, -i, "localhost,", -c, local, /opt/ecommerce-source/ansible/playbook.yml, -e, "@/etc/ecommerce-agent-bootstrap/config.json"]

