
#cloud-config

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-apt
  - git
  - ansible
  - curl
  - ca-certificates
  - gnupg
  - unzip

write_files:
  - path: /etc/ecommerce-agent-bootstrap
    owner: root:root
    permissions: '0644'
    content: |
      bootstrap_version=1.3.0
      configuration=cloud-init

runcmd:
  - [mkdir, -p, /opt/ecommerce-agent]
  - git clone https://github.com/sharadshukla/E-Commerce.git /opt/ecommerce-source
  - git -C /opt/ecommerce-source checkout --detach __BOOTSTRAP_COMMIT_SHA__
  - ansible-playbook -i localhost, -c local /opt/ecommerce-source/ansible/playbook.yml
